services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-0000}
      MYSQL_DATABASE: ${DB_NAME:-paxeterna}
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - paxeterna_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  paxeterna_mysql:
    name: paxeterna_mysql_migrations